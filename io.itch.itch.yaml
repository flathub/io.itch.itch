app-id: io.itch.itch
runtime: org.freedesktop.Platform
runtime-version: &runtime-version '26.08'
sdk: org.freedesktop.Sdk
base: org.winehq.Wine
base-version: stable-26.08
command: itch-run
separate-locales: false
# Copied from
# https://github.com/flathub/org.winehq.Wine/blob/639730a8b682a1a6f929a780c91f0a2bf2bc6cf5/org.winehq.Wine.yml#L6
# as per https://github.com/flathub/org.winehq.Wine/issues/345
x-gl-version: &gl-version '1.4'
x-gl-versions: &gl-versions 26.08;26.08-extra;1.4
x-gl-merge-dirs: &gl-merge-dirs vulkan/icd.d;glvnd/egl_vendor.d;egl/egl_external_platform.d;OpenCL/vendors;lib/dri;lib/d3d;lib/gbm;vulkan/explicit_layer.d;vulkan/implicit_layer.d;vdpau
finish-args:
#  - --allow=devel # For Wine crash handling
  - --allow=multiarch

  - --device=all

  - --share=ipc
  - --share=network

  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio

  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.ScreenSaver

  # Electron registers with the watcher and must own
  # org.freedesktop.StatusNotifierItem-<pid>-<n>. itch-run execs into the
  # app so it stays PID 2 in the sandbox.
  - --talk-name=org.kde.StatusNotifierWatcher
  - --own-name=org.freedesktop.StatusNotifierItem-2-1

  - --env=PATH=/app/bin:/usr/bin:/usr/lib/extensions/vulkan/gamescope/bin
  - --env=WINEPREFIX=/var/data/wine
  - --env=WINEDLLOVERRIDES=mscoree,mshtml='
  - --env=WINEDLLPATH=/app/dlls/lib32:/app/dlls/lib:/app/lib32/wine/wined3d:/app/lib/wine/wined3d
  - --env=LD_LIBRARY_PATH=/app/lib:/app/lib32
  # Copied from
  # https://github.com/flathub/org.winehq.Wine/blob/639730a8b682a1a6f929a780c91f0a2bf2bc6cf5/org.winehq.Wine.yml#L26
  # as per https://github.com/flathub/org.winehq.Wine/issues/345
  - --env=GST_PLUGIN_SYSTEM_PATH=/app/lib/gstreamer-1.0:/app/lib32/gstreamer-1.0:/usr/lib/extensions/gstreamer-1.0:/usr/lib/x86_64-linux-gnu/codecs-extra/lib/gstreamer-1.0:/usr/lib/i386-linux-gnu/codecs-extra/lib/gstreamer-1.0:/usr/lib/x86_64-linux-gnu/gstreamer-1.0:/usr/lib/i386-linux-gnu/gstreamer-1.0
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

  - --persist=.wine
  - --persist=.wine64
#  - --persist=.

inherit-extensions:
  - org.winehq.Wine.gecko
  - org.winehq.Wine.mono

add-extensions:
  # Mostly Copied from
  # https://github.com/flathub/org.winehq.Wine/blob/639730a8b682a1a6f929a780c91f0a2bf2bc6cf5/org.winehq.Wine.yml#L31
  # as per https://github.com/flathub/org.winehq.Wine/issues/345
  org.freedesktop.Platform.Compat.i386:
    directory: lib/i386-linux-gnu
    version: *runtime-version

  org.freedesktop.Platform.Compat.i386.Debug:
    directory: lib/debug/lib/i386-linux-gnu
    version: *runtime-version
    no-autodownload: true

  org.freedesktop.Platform.GL32:
    directory: lib/i386-linux-gnu/GL
    version: *gl-version
    versions: *gl-versions
    subdirectories: true
    no-autodownload: true
    autodelete: false
    add-ld-path: lib
    merge-dirs: *gl-merge-dirs
    download-if: active-gl-driver
    enable-if: active-gl-driver
    autoprune-unless: active-gl-driver

  org.freedesktop.Platform.codecs_extra.i386:
    directory: lib/i386-linux-gnu/codecs-extra
    version: 26.08-extra
    autodelete: false
    add-ld-path: lib

modules:
  - shared-modules/glu/glu-9.json

  - name: zypak
    sources:
      - type: git
        url: https://github.com/refi64/zypak
        tag: v2025.09
        commit: 693a71c5ffa80ec9c9ce2ae03b1ccc493c698e53
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$

  - name: firejail
    buildsystem: autotools
    sources:
      - type: git
        url: https://github.com/netblue30/firejail.git
        tag: 0.9.80
        commit: 13604ce28418d1584a5ffc8eca4ac85522fef3b6
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$

  - name: gamescope
    buildsystem: simple
    build-commands:
      - mkdir -p /app/utils/gamescope

  - name: gamemode
    buildsystem: meson
    config-opts:
      - -Dwith-examples=false
      - -Dwith-util=false
      - -Dwith-sd-bus-provider=no-daemon
    post-install:
      - install -Dm755 ../data/gamemoderun -t /app/bin
    sources:
      - type: git
        url: https://github.com/FeralInteractive/gamemode.git
        tag: 1.8.2
        commit: c54d6d4243b0dd0afcb49f2c9836d432da171a2b
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$

  - name: itch
    buildsystem: simple
    build-commands:
      # Copied from
      # https://github.com/flathub/org.winehq.Wine/blob/639730a8b682a1a6f929a780c91f0a2bf2bc6cf5/org.winehq.Wine.yml#L446
      # as per https://github.com/flathub/org.winehq.Wine/issues/345
      # To mount 32b extensions
      - install -Dm644 -t ${FLATPAK_DEST}/etc ld.so.conf
      - mkdir -p ${FLATPAK_DEST}/lib/i386-linux-gnu
      - mkdir -p ${FLATPAK_DEST}/lib/debug/lib/i386-linux-gnu
      - mkdir -p ${FLATPAK_DEST}/lib/i386-linux-gnu/GL
      - mkdir -p ${FLATPAK_DEST}/lib/debug/lib/i386-linux-gnu/GL
      - mkdir -p ${FLATPAK_DEST}/lib/i386-linux-gnu/dri/intel-vaapi-driver
      - mkdir -p ${FLATPAK_DEST}/i386/nvidia-vaapi-driver

      # Application installation
      - install -D -t "${FLATPAK_DEST}/share/applications/" ./io.itch.itch.desktop
      - install -D -t "${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/" ./io.itch.itch.svg
      - install -D -t "${FLATPAK_DEST}/share/metainfo/" ./io.itch.itch.metainfo.xml
      - mv * /app/bin/
    sources:
      - type: file
        url: https://raw.githubusercontent.com/itchio/press-kit/304cdedcd99e6c0e8cd8d5b08b9bfe773b679579/logos/app-icon.svg
        dest-filename: io.itch.itch.svg
        sha256: eaf979c6c7c315a7004971bc82bbced24c06d7d4fff7f518d7cfd83863ea4285

      - type: file
        path: io.itch.itch.desktop

      - type: file
        path: io.itch.itch.metainfo.xml

      - type: file
        path: itch-run

      # Needed for wow64
      # as per https://github.com/flathub/org.winehq.Wine/issues/345
      - type: file
        url: https://raw.githubusercontent.com/flathub/org.winehq.Wine/639730a8b682a1a6f929a780c91f0a2bf2bc6cf5/ld.so.conf
        dest-filename: ld.so.conf
        sha256: 668c5c2fd1c26b444022ca5bed7031ca717fcfac5908addde4a5b8b37e6c7253

      - type: archive
        strip-components: 0
        archive-type: zip
        url: https://broth.itch.zone/itch/linux-amd64/26.20.0/archive/default
        sha256: abba4743999de78012f8b7c845019a025eaeb05bf641203c8e07003a7de6ac0e
        x-checker-data:
          type: html
          url: https://broth.itch.zone/itch/linux-amd64/LATEST
          version-pattern: ([\d.]+)
          url-template: https://broth.itch.zone/itch/linux-amd64/$version/archive/default
